services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    healthcheck:
      # The temporary initialization server only accepts Unix-socket connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U folio -d folio"]
      interval: 1s
      timeout: 3s
      retries: 60
    # Keep the smoke test database ephemeral.
    tmpfs:
      - /var/lib/postgresql/data

  reservoir:
    image: ${RESERVOIR_TEST_IMAGE:-reservoir-jit:smoke-test}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: folio
      DB_PASSWORD: folio
      DB_HOST: postgres
      DB_DATABASE: folio
      DB_PORT: 5432
    ports:
      - "127.0.0.1::8081"
