services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      # The temporary initialization server only accepts Unix-socket connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U folio -d folio"]
      interval: 1s
      timeout: 3s
      retries: 60
    # Keep the smoke test database ephemeral.
    tmpfs:
      - /var/lib/postgresql/data

  reservoir:
    image: ${RESERVOIR_TEST_IMAGE:-reservoir-jit:smoke-test}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: folio
      DB_PASSWORD: folio
      DB_HOST: postgres
      DB_DATABASE: folio
      DB_PORT: 5432
      HTTP_PORT: 18081
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=55.0 -XX:-UseCompactObjectHeaders"
    ports:
      - "127.0.0.1::18081"

  probe:
    image: ${RESERVOIR_TEST_IMAGE:-reservoir-jit:smoke-test}
    entrypoint:
      - /opt/graalvm-slim/bin/java
      - --sun-misc-unsafe-memory-access=allow
      - --enable-native-access=ALL-UNNAMED
      - -cp
      - /reservoir.jar
      - com.indexdata.reservoir.server.JitRuntimeProbe
    command: [postgres]
    volumes:
      - ./probe-tls.p12:/probes/tls.p12:ro
