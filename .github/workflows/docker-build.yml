name: publish-image

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - mvn-verify
    types:
      - completed
    branches:
      - master

env:
  REGISTRY: ghcr.io
  CURRENT_BRANCH: ${{ github.ref_name }}
  # workflow_run's github.sha can be newer than the commit that passed verification.
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: jit
            dockerfile: ./Dockerfile-jit
            image: ${{ github.repository }}-jit
            title: Reservoir GraalVM JIT image
            licenses: AGPL-3.0-only (Reservoir), GFTC (GraalVM, see /graalvm-license)
          # native build is extremely slow in CI (20m), only enable if the chart uses the  native image
          # - module: native
          #   dockerfile: ./Dockerfile-native
          #   image: ${{ github.repository }}-native

    steps:
      - name: checkout module
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive

      - name: Record publication source
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/published-source"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/published-source/source-sha"
          echo "short_sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/README.md
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.vendor=Index Data ApS
          # GHCR ignores labels so we push them also as annotations
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/README.md
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.vendor=Index Data ApS
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file:  ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }} # GHCR ignores labels so we push them also as annotations
          build-args: |
            GIT_COMMIT=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pass publication source to Helm
        uses: actions/upload-artifact@v7
        with:
          name: published-source-${{ matrix.module }}
          path: ${{ runner.temp }}/published-source/source-sha
          if-no-files-found: error
          overwrite: true
