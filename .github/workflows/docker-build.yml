name: publish-image

on:
  workflow_dispatch:
  pull_request:
  workflow_run:
    workflows: [mvn-verify]
    types: [completed]
    branches: [master]

env:
  REGISTRY: ghcr.io
  CURRENT_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: jit
            dockerfile: ./Dockerfile-jit
            image: ${{ github.repository }}-jit
            title: Reservoir GraalVM JIT image
            licenses: AGPL-3.0-only (Reservoir), GFTC (GraalVM, see /graalvm-license)
          # native build is extremely slow in CI (20m), only enable if the chart uses the  native image
          # - module: native
          #   dockerfile: ./Dockerfile-native
          #   image: ${{ github.repository }}-native

    steps:
      - name: Check master verification before publication
        if: github.event_name == 'workflow_run'
        env:
          VERIFY_EVENT: ${{ github.event.workflow_run.event }}
          VERIFY_RESULT: ${{ github.event.workflow_run.conclusion }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$VERIFY_EVENT" != push || "$VERIFY_RESULT" != success || "$VERIFIED_SHA" != "$GITHUB_SHA" ]]; then
            echo 'Publication requires a successful master push verification for this commit.' >&2
            exit 1
          fi

      - name: checkout module
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/README.md
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=Index Data ApS
          # GHCR ignores labels so we push them also as annotations
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/README.md
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=Index Data ApS
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            MAVEN_MOUNT_TARGET=/tmp/unused-maven-cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check JIT runtime capabilities and ingest
        if: matrix.module == 'jit'
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          image=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          bash tests/docker-jit-smoke.sh "$image:sha-${GITHUB_SHA:0:7}"

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        # Export the tested build from this builder's cache with OCI annotations.
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          file:  ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }} # GHCR ignores labels so we push them also as annotations
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            MAVEN_MOUNT_TARGET=/tmp/unused-maven-cache
