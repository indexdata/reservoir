name: mvn-verify
on:
  push:
    branches: [master]
  pull_request:

jobs:
  docker-jit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build JIT image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-jit
          load: true
          tags: reservoir-jit:smoke-test
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=jit-smoke
          cache-to: type=gha,mode=max,scope=jit-smoke
      - name: Check JIT runtime capabilities and ingest
        run: bash tests/docker-jit-smoke.sh reservoir-jit:smoke-test

  mvn-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1 # https://github.com/graalvm/setup-graalvm
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Show GraalVM and Java versions
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
      - name: Run the Maven verify phase
        run: mvn -B verify

  mvn-native-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U folio -d folio"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Show GraalVM and Java versions
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
      - name: Run the Maven verify phase with the native profile
        env:
          GRAALVM_QUICK_BUILD: 'true'
        run: mvn -B -Pnative verify
      - name: Check native executable startup
        env:
          DB_USERNAME: folio
          DB_PASSWORD: folio
          DB_HOST: 127.0.0.1
          DB_DATABASE: folio
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: bash tests/native-smoke.sh
