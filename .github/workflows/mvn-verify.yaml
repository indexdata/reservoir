name: mvn-verify
on:
  push:
    branches: [master]
  pull_request:

jobs:
  docker-jit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build JIT image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-jit
          load: true
          tags: reservoir-jit:smoke-test
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=jit-smoke
          cache-to: type=gha,mode=max,scope=jit-smoke
      - name: Check JIT image startup
        run: bash tests/docker-jit-smoke.sh reservoir-jit:smoke-test

  mvn-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1 # https://github.com/graalvm/setup-graalvm
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Show GraalVM and Java versions
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
      - name: Run the Maven verify phase
        run: mvn -B verify
