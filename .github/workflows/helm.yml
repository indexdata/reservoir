name: publish-chart

permissions:
  actions: read
  packages: write
  contents: read

on:
  # we only publish the chart after succesful Docker build so we trigger
  # a full build when chart templates are changed, this is slightly suboptimal
  # TODO automatically bump chart version during build
  workflow_run:
    workflows:
      - publish-image
    types:
      - completed
    branches:
      - master

jobs:
  publish-chart:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart_name: reservoir
            chart_base_version: "0.1.0-master.${{ github.run_number }}"
            chart_path: ./chart
            md_path: ./descriptors/ModuleDescriptor-template.json
    steps:
      # Use the source recorded by this exact image build, not either workflow's github.sha.
      - name: Download publication source
        uses: actions/download-artifact@v8
        with:
          name: published-source-jit
          path: ${{ runner.temp }}/published-source
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read publication source
        id: source
        run: |
          SOURCE_SHA=$(cat "$RUNNER_TEMP/published-source/source-sha")
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid publication source SHA" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Calculate chart and app version with short SHA
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          SHORT_SHA=${SOURCE_SHA:0:7}
          CHART_VERSION="${{ matrix.chart_base_version }}+sha.$SHORT_SHA"
          APP_VERSION="sha-$SHORT_SHA"
          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Process MD for okapi-hooks
        if: ${{ matrix.md_path }}
        run: |
          sed -i "s/\${artifactId}/mod-${{ matrix.chart_name }}/" ${{ matrix.md_path }}
          sed -i "s/\${version}/$CHART_VERSION/" ${{ matrix.md_path }}
          sed 's/^/    /' ${{ matrix.md_path }} > indented.json
          sed -i -e '/@descriptor@/{
            r indented.json
            d
          }' ${{ matrix.chart_path }}/values.yaml

      - name: helm lint
        run: |
            helm lint ${{ matrix.chart_path }}

      - name: helm login
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u $ --password-stdin

      - name: helm dependency
        run: |
          helm dependency build ${{ matrix.chart_path }}

      - name: helm package
        run: |
          helm package ${{ matrix.chart_path }} --version "$CHART_VERSION" --app-version "$APP_VERSION"

      - name: helm push
        run: |
          helm push "${{ matrix.chart_name }}-$CHART_VERSION.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
