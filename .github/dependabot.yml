version: 2
updates:
  # Maven (root + all modules)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["deps"]
    ignore:
      - dependency-name: "org.graalvm*"
        versions: [">= 25.1"]    # stay on 25.0.x series
    groups:
      build-tools:
        patterns:
          - "*-plugin"           # typical plugin naming
          - "*-plugin-*"         # plugin extensions/dependencies
          - "org.apache.maven.plugins:*"
          - "com.puppycrawl.tools:checkstyle"
      runtime-deps:
        patterns:
          - "*"                  # catch everything else
        exclude-patterns:
          - "*-plugin"           # exclude plugin artifacts
          - "*-plugin-*"         # exclude plugin extensions/dependencies
          - "org.apache.maven.plugins:*"
          - "com.puppycrawl.tools:checkstyle"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["deps"]

  # Dockerfiles (if you have any, adjust path or add more entries)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["deps"]
